<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08_responsive2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            padding: 0 150px;
            height: 500px;

            position: relative; /* nav, aside의 기준! */
        }
        main {
            background-color: tomato;
            height: 500px;
        }
        nav {
            width: 150px;
            background-color: yellow;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
        }

        aside {
            width: 150px;
            background-color: greenyellow;
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
        }

        /* 최소너비 769px ~ 최대너비 1024px */
        @media (min-width: 769px) and (max-width: 1024px) {

            #wrap {
                padding: 0;
                height: auto;
                position: static; /* position의 기본값! */
                /* 	position: static은 이전에 설정한 absolute나 relative를 무효화하고 원래 위치로 되돌리는 역할
                모바일에서는 수직 스크롤 중심이므로 좌우 배치를 없애고 요소들이 위에서 아래로 쌓이게 만들기 위해 사용   
                */
            }
            #wrap > div {
                height: 500px;
                padding-left: 150px;
                position: relative; /* nav의 기준! */
            }
            aside {
                position: static;
                width: 100%;
                height: 100px;
            }
        }

        /* 최소너비 321px ~ 최대너비 768px */

        @media (min-width:321px) and (max-width:768px) {
            #wrap {
                padding: 0;
                height: auto;
                position: static;
            }

            main {
                background-color: plum;
            }

            nav {
                position: static;
                width: 100%;
                height: 120px;
            }

            aside {
                position: static;
                width: 100%;
                height: 300px;

            }
        }

        /* 최소너비 0px ~ 최대너비 320px */

        @media (min-width: 0px) and (max-width: 320px) { /* media 구간으로 쓸때때는 공통으로 가질수 있는 코드를 한번더 써줘야 적용이 됨 */
            #wrap {
                padding: 0;
                height: auto;
                position: static;
            }

            main {
                height: 700px;
                background-color: lightpink;
            }

            nav {
                position: static;
                width: 100%;
                height: 300px;
            }

            aside {
                position: static;
                width: 100%;
                height: 450px;
            }
        }

    </style>
</head>
<body>

    <div id="wrap">
        <div>
            <main>메인</main>
            <nav>메뉴</nav>
        </div>

        <aside>광고영역</aside>
    </div>
    
</body>
</html>
