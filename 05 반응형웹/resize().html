<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resize()</title>

    <!-- jQuery 라이브러리 연결!! -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        /*
        resize() 이벤트 메서드
        - 브라우저 창의 크기가 변경될 때 발생
        - 이벤트 대상 : $(window)
        - 제이쿼리 시작코드 안에 작성x
        */

        $(window).resize(function(){

            var vw = $(this).width();

            $('#here').text(vw);
        });

    </script>
</head>
<body>

    <p>변경된 브라우저 너비 : <span id="here">0</span>px</p>


    <style>
        p {font-size: 32px;}
    </style>
    
</body>
</html>
