<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03_media-query</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            display: block;
        }

        header {
            width: 100%;
            height: 100px;
            line-height: 100px;
            text-align: center;
            background-color: black;
            color: #fff;
            font-size: 2.4rem;

            position: fixed;
            left: 0;
            top: 0;

            z-index: 999;
        }

        section {
            margin-top: 100px;
        }

        article.main {
            width: 100%;
            height: 700px;
            background-color: bisque;
            background-image: url(images/irene.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: top;
            font-size: 0;
            margin-bottom: 100px;

        }

        article.album {
            margin-bottom: 100px;

        }

        article.album h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
        }

        article.album .album-thumb {
            width: 100%;
            max-width: 767px;
            margin: 0 auto 40px;
            outline: 3px solid red;
        }

        /* article.album .album-thumb::after {
            content: "";
            display: block;
            clear: both;
        }

        article.album .album-thumb a {
            width: 50%;
            float: left;

        } */

        article.album .album-thumb a img {
            width: 100%;
            display: block;
        }

        article.album .btn {
            font-size: 1.2rem;
            border: 1px solid #ccc;
            width: 300px;
            text-align: center;
            padding: 16px 0;
            color: #666;
            border-radius: 6px;
            margin: 0 auto;

        }


        article.banner {
            width: 100%;
            margin: 0 auto;
            background-color: rebeccapurple;
            color: white;
            padding: 50px 0;
            font-size: 1.6rem;
            line-height: 3;
            letter-spacing: 2px;
            text-align: center;
        }

        footer {
            width: 100%;
            padding: 40px 0 60px;
            background-color: lightgray;
            text-align: center;
        }

        @media all and (min-width:767px) {
            article.main {
                height: 500px;
                background-image: url(images/redvelvet2.jpg);
            }

            article.album .album-thumb::after {
                content: "";
                display: block;
                clear: both;
            }

            article.album .album-thumb a {
                width: 50%;
                float: left;

            }

            article.album .album-thumb a img {
                width: 100%;
                display: block;
            }

            article.album .album-thumb .btn {
                width: 90%;
            }

            article.banner {
                font-size: 1.6rem;
                background-color: darkblue;
            }
        }

        @media all and (min-width:1024px) {
            article.main {
                height: 500px;
                background-image: url(images/redvelvet.jpg);
            }

            article.banner {
                width: 100%;
                max-width: 1320px;
                background-color: tomato;

            }
        }
    </style>
</head>

<body>

    <header>SM TOWN</header>

    <section>
        <article class="main">
            레드벨벳 화보 이미지입니다.
        </article>

        <article class="album">
            <h2>New Album</h2>



            <div class="album-thumb">
                <a href="#"><img src="images/album1.jpg" alt=""></a>
                <a href="#"><img src="images/album2.jpg" alt=""></a>
            </div>

            <a href="#" class="btn">지난앨범 보러가기</a>
        </article>

        <article class="banner">
            <p>Red Velvet</p>
        </article>
    </section>

    <footer>
        <p>&copy; Copyright2025</p>
    </footer>

</body>

</html>
