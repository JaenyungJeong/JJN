<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06_font-rem</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        p {
            font-size: 6rem;
        }

        p span {
            font-size: 48px;
            font-size: 3rem;
            /* 1rem = 16px,, 16px * 3 = 48px */
        }
    </style>
</head>
<body>

    <p>

        rem 단위!
        <span> rem 단위2!!</span>

    </p>
    
</body>
</html>
