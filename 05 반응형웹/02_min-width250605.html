<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_min-width</title>

    <style>
        body {
            background-color: black;

        }

        h1 {
            color: aliceblue;
        }

        img {
            width: 100%;
        }

        /* min-width 는 작은 수치에서 큰 수치 순서로 작성! */

        @media all and (min-width: 360px) {

            /* 최소너비 360부터~늘어나면서  min-width 는 작은 값부터 큰값으로 작성순서 중요! 모바일버전 만들시 시작*/
            img {
                width: 80%;
            }
        }

        @media all and (min-width: 768px) {
            img {
                width: 50%;
            }
        }

        @media all and (min-width: 1024px) {
            img {
                width: 33.33%;
            }

            img:last-child {
                display: none;
            }
        }
    </style>
</head>

<body>

    <h1>Colorful Fruits</h1>

    <img src="images/kiwi.jpg" alt="키위"><img src="images/orange.jpg" alt="오렌지"><img src="images/blueberry.jpg"
        alt="블루베리"><img src="images/dragonfruit.jpg" alt="용과">

</body>

</html>
