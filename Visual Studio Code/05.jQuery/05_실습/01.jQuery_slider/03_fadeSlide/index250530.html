<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>fadeSlide</title>

        <style>

            * {
                margin: 0;
                padding: 0;
            }

            h1 {
                background-color: #fff09f;
                line-height: 100px;
                text-align: center;
            }

            /* .viewer - 실제 슬라이드가 보여지는 공간! + 전체 슬라이드를 담는 부모! */

            .viewer {
                width: 1420px;
                height: 610px;
                /* outline: 2px solid red; */
                margin: 60px auto;
                border-radius: 30px;
                overflow: hidden;

                position: relative;
                /* 앱솔루트 해서 부모높이 0이므로 요소의 높이값을 지정 */

            }

            
            .viewer .slide {
                width: 100%; /* 너비가 없으면 내용만큼의 너비를 제각각 잡게 되서 각각의 슬라이드엔 너비를 꼭 주어야함  */
                position: absolute;
                /* 좌표를 안넣었을 때는 내가 현재 있는 곳이 left:0 top:0 으로 생각하고 현재 자리에 있음 
                이후 좌표 넣으면 그 좌표로 이동 / 앱솔루트 이후는 나는 절대위치가 갖는 크기를 기준으로 독립해서 부모의 높이를 못읽음 부모의 높이를 가지지 않음
                */
            }
            .viewer .slide img {
                width: 100%;
                display: block;
                /* 이미지를 담는 박스를 쓰는 이유 화면의 물리적인 크기 지원하는 해상도도 다름 기기도 여러가지라서
                디바이스에 따라 유동적으로 크기조절하려면 이미지 만으로는 크기변화는 한계가 있음 */
            }

            .viewer .active {
                z-index: 1;
            }

            

        </style>

        <script src="jquery-1.12.4.min.js"></script>
        <script>

            /* 
            (무한) 반복 슬라이드 구현시
            1.한 번의 이동
            2.다음을 위한 준비!
            
            *fade 슬라이드 전환 원리
            현재 보이는 슬라이드 >> 1번
            '다음'에 보여질 슬라이드 >> 2번

            1) 1번 슬라이드가 보여지도록 z-index 값 설정 (active 클래스 사용) -> setInterval 로 1번 인덱스가 시작될 때 
            2) 2번 슬라이드에 fadeIn 효과를 적용할 수 있도록 display:none 설정, active 클래스(z-index) 추가 -> hide(), addClass()
            3) 2번 슬라이드의 등장! (fadeIn 효과!)
            4) 1번 슬라이드 .viewer의 맨 뒤로 이동 (다음을 위한 준비!), active 클래스(z-index) 제거 -> append(), appendTo(), removeClass()
            

        
            
            */

            $(document).ready(function(){
                //함수호출!
                //fadeSlide();
                //1. 클릭할 때 마다 함수 호출
                /* $('.viewer').click(function(){
                    fadeSlide();
                }); */

                //2. 3초 간격으로 함수 호출 (자동실행) setInterval은 시작코드블럭 없이 바로 사용가능

                // setInterval(fadeSlide, 3000); 

                //3. 이벤트 연결 
                // 마우스를 올렸을 때 자동실행 멈춤 -> clearInterval()
                //마우스가 벗어나면 자동실행!

                var autoCall; //인터벌을 담는 변수

                autoCall = setInterval(fadeSlide, 3000);

                $('.viewer').mouseover(function(){
                    //인터벌 제거 - 멈춤
                    clearInterval(autoCall);
                }).mouseout(function(){
                    //인터벌 재가동
                    autoCall = setInterval(fadeSlide, 3000);
                });
            });

            /*////////////////////////////////////

            함수명 : fadeSlide
            기능 : fade 효과를 적용해 슬라이드 전환

            ///////////////////////////////////*/

            function fadeSlide (){

                //1번 - 현재 보여지는 슬라이드, 첫 번째 슬라이드
                var firstSlide = $('.viewer .slide').first();

                //2번 - 현재 보여지는 슬라이드의 '다음' 슬라이드

                var nextSlide = firstSlide.next();

                nextSlide.hide().addClass('active').fadeIn(800, function(){
                    //다음을 위한 준비!
                    //1번 슬라이드를 맨 뒤로 이동!!
                    $('.viewer').append(firstSlide);

                    //첫번째 슬라이드의 z-index제거!
                    firstSlide.removeClass('active');

                });
            }


            
        </script>
    </head>
    <body>

        <h1>Knotted Donut</h1>

        <div class="viewer">
            <div class="slide active"><img src="slide1.jpg" alt=""></div>
            <div class="slide"><img src="slide2.jpg" alt=""></div>
            <div class="slide"><img src="slide3.jpg" alt=""></div>
            <div class="slide"><img src="slide4.jpg" alt=""></div>
        </div>

        <!-- 
        fade 효과를 적용한 slide 구현은 
        실제 슬라이드가 보여지는 영역이 슬라이드 전체를 담는 역할을 대신할 수 있다!

        
        -->
        
    </body>
</html>
