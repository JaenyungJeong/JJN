<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>02_prepend</title>

    <script src="jquery-1.12.4.min.js"></script>

    <script>

        /* 
        prepend(),prependTo()
        : 선택한 요소의 하위요소로 맨 앞에 새 요소를 생성하거나 추가
        : 기존 자식 요소를 맨 앞으로 이동

        $('기준요소').prepend('새 요소');
        $('새 요소').prependTo('기준요소');
        
        */

        $(function(){
            // 예제1

            $('#listZone').prepend('<li>내가 처음 prepend!</li>');
            $('<li>내가 진짜 처음 prependTo!</li>').prependTo('#listZone');

            // 예제2 - 2개의 이미지 번갈아 추가하기
            // 1.이미지 경로를 담는 배열!! 여러개 값이 있고 계속 추가되도 변수 설정 가능하게
            

            var imgSrc = ['https://dimg.donga.com/wps/NEWS/IMAGE/2023/06/22/119900215.1.jpg','https://image.ajunews.com/content/image/2025/03/07/20250307151715483304.png'];
            
            // 2.인덱스 번호가 바뀔것을 고려해서(var imgSrc[0],var imgSrc[1]) 추가 변수 설정 

            var idx = 0;

            /* $('.img-box').prepend('<img src="' + imgSrc[idx] + '" alt="고양이">');
            */

            $('.img-box').click(function(){
                //이미지넣기!
                $(this).prepend('<img src="' + imgSrc[idx] + '" alt="강아지">'); // this 로 지정안하고 .img-box로 지정하면 여러개의 클래스가 있을 시 아무 박스나 클릭해도 전부 구현이됨

                //1) 이미지 순번바꾸기1
                /* idx++;

                if(idx >= 2){ //idx === 2 , 1일 때는 if 문 실행 안함!
                    idx = 0
                    console.log('if문 실행!!');
                } */

                //2) 이미지 순번바꾸기2 - 삼항조건 연산자
                // 조건식 ? 실행문1 : 실행문2;

                idx === 0 ? idx = 1 : idx = 0;

            });
        });

        /* 
        1) 사진을 숨긴다
        2) 하단 상자를 클릭하면 1번 이미지가 나온다 
        3) 짝수번째 클릭했을 때 2번 이미지가 앞에 추가되며 나온다 prepend()
        4) 홀수번째 클릭했을 때 1번 이미지가 다시 추가된다 prepend() -> 해당 구현 반복 
        */


    </script>
</head>
<body>

    <!--  예제1 -->

    <ul id="listZone">
        <li>리스트1</li>
        <li>리스트2</li>
        <li>리스트3</li>
        <li>리스트4</li>
        <li>리스트5</li>
    </ul>

    <!-- 예제2 -->

    <h2>하단 상자를 클릭하여 이미지를 추가해 보세요!</h2>

    <div class="img-box">
        <!-- <img src="https://dimg.donga.com/wps/NEWS/IMAGE/2023/06/22/119900215.1.jpg" alt="">
        <img src="https://image.ajunews.com/content/image/2025/03/07/20250307151715483304.png" alt=""> -->

    </div>

    <style>
        .img-box {
            
            outline: 2px solid plum;
            padding: 20px;
            cursor: pointer;
            margin-top: 20px;

        }

        .img-box img {
            width: 300px;
        }
    </style>
    
</body>
</html>
