<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>06_자식선택자</title>

    <script src="jquery-1.7.2.min.js"></script>

    <script>
        /* 
        자식요소 선택자 기본형
        1) $('기준요소 > 자식요소')
        2) $('기준요소').children() 대상을 선택!
        3) $('기준요소').children('자식요소') 특정자식요소만 선택해!
        
        */

        $(function(){
            // $('#wrap').children().css('border','2px dashed blue');
            // $('#wrap').children('p').css('color','red');

            $('#wrap').click(function(){ //이벤트를 발생시켜야 코드가 실행 -> this 사용 !
                // $(this).children('p').css('backgroundColor','yellow');

                //클릭한 #wrap 의 자식요소 p태그만 선택
                //$(this, '>p')는 클릭당한 #wrap 만 선택!
                $('>p', this).css({ //자식 p태그를 this 기준으로! 
                    backgroundColor: 'tomato',
                    color: 'white',
                    
                }); 
            });
        });

    </script>
</head>
<body>
    
    <div id="wrap">
        <h2>기본 선택자</h2>
        <p>내용1</p>

        <div id="section">
            <h2>하위요소 선택자</h2>
            <p>내용2</p>
        </div>
    </div>

</body>
</html>
