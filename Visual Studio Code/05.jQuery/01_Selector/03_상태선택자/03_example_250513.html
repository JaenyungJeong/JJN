<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>03_example</title>

    <script src="jquery-1.7.2.min.js"></script>
    <script src="jquery-ui-1.8.23.custom.min.js"></script>

    <script>

        /* 
        **효과메서드 : 소요시간 / 가속도easing / 콜백함수 
        1. show() - display 상태를 none이 아닌 것으로 변경 (원래 값으로!)

        2. hide() - display 상태를 none으로 변경

        3. animate({
            css 설정
        }, 소요시간(ms), 가속도, 콜백함수)

        - css 변경사항을 애니메이션 해주는 효과 메서드
        - css에 트랜지션을 넣은 것과 같은 효과 구현
        - 수치로 된 속성값만 적용 가능
        

        4. delay()
        : 효과 메서드 앞에서 사용
        : 효과 메서드 시작을 지연시킬 때 사용 
        */

        //예제 - 색상 버튼을 클릭하면 색상 정보가 변경되고 .img-box의 배경색이 클릭한 버튼의 색상으로 변경되도록 구현하시오.

        /*
        색상 버튼을 클릭하면 >> 클릭대상: button, 이벤트: click()

        1) 색상정보를 바꾸고 >> .select span / text()
        2) .img-box의 배경색 변경! >> .img-box / css()

        우리에게 필요한 값은?
        >> 내가 클릭한 버튼의 색상!!!! -> 내가 클릭한 버튼의 버튼명!!!
        >> 버튼명 반환 -> text()
        */

        $(document).ready(function (){

            $('button').click(function (){

                //클릭한 버튼의 버튼명 반환
                var color = $(this).text();
                console.log(color);

                /* //1) 색상정보변경
                $('.select').find('span').text(color).css('color',color);

                //2) .img-box 배경색변경
                $('.img-box').css('background-color', color); */


            
                //1) 색상정보 변경
                //$('.select').hide(1000).text(color);

                $('.select').hide(1000, function(){
                    //alert('안녕!!!!');
                    $(this).find('span').text(color).css('color', color);
                }).show(1000);


                //2) img-box 변경
                $('.img-box').delay(2000).animate({
                    backgroundColor: color
                }, 800, function (){
                    //+이미지 등장!!!
                    $(this).find('img').css({
                        transform: 'scale(1)',
                        transition: 'all 1s'
                    });
                });
            
            });

        });






        /* //한 번의 실행 먼저!!!!
        $(function(){
            $('#red').click(function(){
                $('.select span').text('red').css('color','red');
                $('.img-box').css('background-color','red');
            });

            $('#orange').click(function(){
                $('.select span').text('orange').css('color','orange');
                $('.img-box').css('background-color','orange');
            });
        }); */



    </script>
</head>
<body>

    <div id="container">
        <h1>무지개색 버튼을 클릭해 보세요!</h1>
        <p class="select"><span>색상</span>을(를) 선택하셨습니다!</p>

        <div class="btngrp">
            <button id="red">red</button>
            <button id="orange">orange</button>
            <button>yellow</button>
            <button>green</button>
            <button>blue</button>
            <button>navy</button>
            <button>purple</button>
        </div>

        <div class="img-box">
            <img src="https://cat-lab.co.kr/data/editor/2211/59b20390d3e9627ce40b23c9e9984d23_1669243031_888.jpg" alt="아기 고양이">
        </div>
    </div>

    <style>
        p {
            font-size: 24px;
        }
        span {
            font-weight: bold;
        }
        button {
            font-size: 24px;
        }
        .btngrp {
            margin-bottom: 20px;
        }
        .img-box {
            width: 800px;
            background-color: #000;
            padding: 20px;
        }
        .img-box img {
            width: 100%;
            display: block;
            transform: scale(0);
        }

    </style>
    
</body>
</html>
