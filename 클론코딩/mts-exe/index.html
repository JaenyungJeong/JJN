<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTS 홈</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header class="header">
    <h1>오늘의 시황</h1>
  </header>

  <section class="market-summary">
    <div class="box kospi">
      <h2>KOSPI</h2>
      <p>2,745.89</p>
      <span class="up">+0.98%</span>
    </div>
    <div class="box kosdaq">
      <h2>KOSDAQ</h2>
      <p>924.10</p>
      <span class="down">-0.45%</span>
    </div>
  </section>

  <section class="stock-list">
    <h2>인기 종목</h2>
    <ul>
      <li><span>삼성전자</span><span>70,000원</span></li>
      <li><span>카카오</span><span>52,000원</span></li>
      <li><span>현대차</span><span>210,000원</span></li>
    </ul>
  </section>

  <section class="notice-banner">
    <p>[이벤트] 신규 가입 시 스타벅스 쿠폰 지급 ☕️</p>
  </section>
</body>
</html>
