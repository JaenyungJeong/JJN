<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>1cutslide-2</title>

        <style>

            *{
                margin: 0;
                padding: 0;

            }

            ul, ol, li {
                list-style: none;
            }

            #slider {
                width: 1200px;
                border: 5px solid #997c70;
                margin: 40px auto;
                overflow: hidden;
                position: relative; /* #pager 의 기준! */

            }

            #gallery {
                width: 400%;
                position: relative; /* js에서 Left 이용시 아이디 갤러리 이동을 위한 포지션 */

            }
            #gallery::after {
                content: "";
                display: block;
                clear: both;
            }

            #gallery img {
                display: block;
                width: 25%;
                float: left;

            }

            #pager {
                /* background-color: navy; */
                position: absolute;
                right: 20px;
                bottom: 20px;


            }
            #pager li {
                width: 40px;
                height: 40px;
                border-radius: 6px;
                background-color: #ecdfcc;

                text-align: center;
                line-height: 40px;

                display: inline-block; /* li를 가로나열 */
                cursor: pointer;
            }

            

            #pager li:hover {
                background-color: #ef5a6c;
                
            }

            #pager li.active {
                background-color: #b6a28e;
                color: #fff;
            }

        </style>

        <script src="script/jquery-1.12.4.min.js"></script>
        <script src="script/1cutslide-2-250528.js"></script>

    </head>
    <body>
        <!-- 
        #slider : 실제 슬라이드가 보여질 공간
        #gallery : 슬라이드 전체를 담는 부모
        #gallery img : 각각의 슬라이드
        
        -->

        <div id="slider">
            <div id="gallery">
                <img src="images/illom-slide1.jpg" alt="">
                <img src="images/illom-slide2.jpg" alt="">
                <img src="images/illom-slide3.jpg" alt="">
                <img src="images/illom-slide4.jpg" alt="">
            </div>

            <ul id="pager">
                <!-- <li><a href="#"></a></li>
                <li><a href="#"></a></li>
                <li><a href="#"></a></li>
                <li><a href="#"></a></li> -->
                
                <li class="active">1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </ul>
        </div>
        
    </body>
</html>
