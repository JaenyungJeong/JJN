<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4cut-slide</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        button {
            font-size: 20px;
            padding: 10px;
            background-color: lightgray;
            border-radius: 6px;
            color: #fff;

            float: left;
            margin-right: 10px;

            position: relative;
            top: 100px;
        }

        /* 실제 슬라이드가 보여지는 공간! */

        #slider {
            width: 1000px;

            /* outline: 2px solid red; */
            overflow: hidden;

            float: left;
        }

        #slider .container {
            /* 실제 움직이는 대상 */
            /* width: 200%; 초반엔 두배로 너비 설정하기 위해 200% 설정*/
            /* background-color: yellow; */

            position: relative;
            /* 좌표로 움직이게 하기 위한 준비! */
        }

        #slider .container::after {
            content: "";
            display: block;
            clear: both;
        }

        #slider .container .item {
            /* width: 240px; */
            height: 300px;
            /* 내용에 따라 높이가 달라디면 줄바꿈시 높이가 다르면 두번째 줄부터 공간을 차지 못하는 상황 생길 수있으므로 높이 지정 */
            margin-right: 10px;
            border: 5px solid lightgray;
            box-sizing: border-box;
            float: left;
        }

        #slider .container .item h2 {
            text-align: center;
        }

        #slider .container .item img {
            width: 100%;
            display: block;
        }
    </style>

    <script src="jquery-1.12.4.min.js"></script>
    <script>

        $(document).ready(function () {

            //css 초기설정
            // #slider 는 실제 보여지는 영역! 고정된 크기 사용
            // .container, .item 의 width 값 설정 (item 이 추가될 것을 고려하여 유동적인 .container 의 너비 설정이 필요!)

            var width = $('#slider').width(), //1000
                count = $('#slider .item').length; // 6
            /* 실제보여지는 공간안에 아이템 6개가  */
            console.log(width, count);

            //css 값 적용하기 - .container
            $('#slider .container').css({
                width: width * count // 1000*6 = 6000px
            }).find('.item').css({
                width: (width / 4) - 10 // 너비 (1000/4) -10(margin-right) = 240 
            });

            //짝수번째 .item의 border-color 변경
            $('.item:nth-child(even)').css('border-color', 'skyblue');
            //nth-child(even|odd)를 사용하면 우리가 아는 순서와 홀수, 짝수를 맞출 수 있다!
            // :odd, :even 은 인덱스 번호를 기준으로 홀수, 짝수 선택!

            /* 
            슬라이드 구현하기

            움직이는 대상 >> .container
            초깃값 >> left: 0 

            * 다음 버튼을 클릭했을 때
            1번 클릭 (2,3,4,5번 아이템)>> left: -250px
            2번 클릭 (3,4,5,6번 아이템)>> left: -500px
            3번 클릭 (4,5,6,7번 아이템)>> left: -750px

            * 이전 버튼을 클릭했을 때
            1번 클릭 (2,3,4,5번 아이템)>> left: -250px
            2번 클릭 (1,2,3,4번 아이템)>> left: 0px
            */


            var currentPage = 0;
            var changePage = function(){

                $('#slider > .container').animate({
                    left: -(currentPage * width) / 4
                }, 600);

                //다음 버튼을 클릭 시
                //cp=0, -(0*1000px) / 4 = -0   , left: 0  
                //cp=1, -(1*1000px) / 4 = -250 , left: -250  
                //cp=2, -(2*1000px) / 4 = -500 , left: -500
                //cp=3, -(3*1000px) / 4 = -750 , left: -750

                //이전 버튼 클릭 시
                //cp=2, left: -500
                //cp=1, left: -250
                //cp=0, left: 0
            };

            //다음 버튼을 클릭했을 때
            $('#right-button').click(function(){

                if(currentPage < count-4){ // 총 아이템 갯수(count)-보여지고 있는 아이템 갯수(4)=2
                    // currentPage++;
                    // currentPage += 1;
                    currentPage = currentPage+1;

                    changePage();
                }

                console.log(currentPage);
            });

            //이전 버튼을 클릭했을 때
            $('#left-button').click(function(){
                
                if(currentPage > 0){  //currentPage 값이 1이상이라는 것은 다음이동이 진행됐다는 의미라서 

                    // currentPage -= 1;//*  */
                    currentPage = currentPage-1;

                    changePage();

                }
            });

            /* $('#right-button').click(function(){

                var conWid = $('.item').outerWidth(true);

                $('#slider .container').animate({
                    left: '-=' + conWid
                },800);
            }); */
        });
    </script>
</head>

<body>

    <button id="left-button">&lt</button> <!-- lt = less than 더 작다 -->

    <div id="slider">
        <div class="container">
            <div class="item">
                <h2>1 Photo</h2>
                <img src="img/trip1.jpg" alt="">
            </div>

            <div class="item">
                <h2>2 Photo</h2>
                <img src="img/trip2.jpg" alt="">
            </div>

            <div class="item">
                <h2>3 Photo</h2>
                <img src="img/trip3.jpg" alt="">
            </div>

            <div class="item">
                <h2>4 Photo</h2>
                <img src="img/trip4.jpg" alt="">
            </div>

            <div class="item">
                <h2>5 Photo</h2>
                <img src="img/trip1.jpg" alt="">
            </div>

            <div class="item">
                <h2>6 Photo</h2>
                <img src="img/trip2.jpg" alt="">
            </div>

            <!-- 추가 -->

            <div class="item">
                <h2>7 Photo</h2>
                <img src="img/trip3.jpg" alt="">
            </div>

            <div class="item">
                <h2>8 Photo</h2>
                <img src="img/trip4.jpg" alt="">
            </div>

            <div class="item">
                <h2>9 Photo</h2>
                <img src="img/trip3.jpg" alt="">
            </div>

            <div class="item">
                <h2>10 Photo</h2>
                <img src="img/trip4.jpg" alt="">
            </div>
            
        </div>
    </div>

    <button id="right-button">&gt</button> <!-- gt = great than 더 크다 -->


</body>

</html>
