<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>hide_show</title>

        <script src="jquery-1.7.2.min.js"></script>

        <script>

            /* 
            
            1)클릭했을 때 이미지 사라짐 hide()
            -이미지 사라지고 나서 다음 이미지 나올 준비를 위하여 이미지 src 속성변경으로 이미지 교체 
            -1~5 까지 이미지 번호 바뀔 변수 필요
            var imgNum = 1;  
            -5까지 이미지가 보여질 증감연산자 필요 
            imgNum++;
            -5 초과가 될시 다시 1이 되도록 조정하는 조건식 필요
            2)클릭했을 때 이미지 보여짐 show()
            보여졌을 때 title 의 번호만 변수에 따라 변경
            */

            $(document).ready(function(){

                var imgNum = 1; 

                $('#hide').click(function(){
                    $('.img-box img').hide(1000, function(){
                        imgNum++;

                        $(this).attr({
                            src : 'image/vogue' + imgNum + '.jpg'
                        });
                    });
                });

                $('#show').click(function(){
                    $('.img-box img').show(1000, function(){
                        $('.no').text(imgNum);
                    });
                });

                $('#toggle').click(function(){
                    $('.img-box img').toggle(1000, function(){
                        var status = $(this).css('display');

                    if(status === 'none'){
                        imgNum++;
                        if(imgNum === 6) imgNum = 1;
                        $(this).attr({
                            src : 'image/vogue' + imgNum + '.jpg'
                        });
                    } else {
                        $('.no').text(imgNum);
                    }
                    });
                    
                });
            });
        </script>
    </head>
    <body>

        <div class="container">
        <div class="btngrp">
            <button id="hide">hide()</button>
            <button id="show">show()</button>
            <button id="toggle">toggle()</button>
        </div>

        <h2 class="title">VOGUE KOREA <span class="no">1</span></h2>

        <div class="img-box">
            <img src="image/vogue1.jpg" alt="김연아 보그 화보">
        </div>
    </div>
        

    </body>

    <style>
        .container {
            width: 560px;
            margin: 0 auto;
        }

        .btngrp {
            margin: 30px 0;
            text-align: center;
        }

        .btngrp button {
            font-size: 24px;
        }

        .title {
            text-align: center;
        }

        .title span {
            color: tomato;
        }

        .img-box {
            padding: 30px;
            outline: 2px solid tomato;
        }

        .img-box img {
            /* width: 100%; */
            width: 500px;
            display: block;
        }

        /* 
        img태그의 크기는 px로 고정된 크기 설정할 것! 
        %로 넣었을 때 너비가 일단 100% 채워지고 높이가 조절되어
        이미지 비율이 깨졌다가 원상복귀됨 
        */
    </style>
</html>
