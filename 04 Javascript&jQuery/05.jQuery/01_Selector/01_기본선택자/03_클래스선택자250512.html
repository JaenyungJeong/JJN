<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03_클래스선택자</title>

    <script src="jquery-1.7.2.min.js"></script>

    <script>
        /* 
        text() 메서드
        1) $(선택자).text();
        - 선택한 요소의 텍스트 반환! (getAttribute 같은 기능)
        
        2) $(선택자).text('내용');
        - 선택한 요소의 텍스트 변경! (setAttribute 같은 기능)
                
        */

        $(document).ready(function(){

            var title = $('.title').text();
            console.log(title);

            $('.title').css('background-color','greenyellow');

            $('.list li').click(function(){
               // $('.list li').text('여름이닷!');
               //변경대상 : .list li 중에 내가 클릭한 li !
               //this >> 이벤트가 직접적으로 발생한, 클릭당한 li 

               $(this).text('여름이닷!!').css({
                    fontSize: '30px',
                    color: 'red',
                    fontWeight: 'bold',
                    transition: 'all 0.5s',
               }); 
               //동일한 대상의 내용을 변경할 때 연결해서 사용(메서드 체이닝 기법)
               
            });
        });
    </script>
</head>
<body>

    <h1 class="title">한국의 4계절</h1>

    <ul class="list">
        <li id="spring">봄</li>
        <li id="summer">여름</li>
        <li id="fall">가을</li>
        <li id="winter">겨울</li>
    </ul>

  
    
</body>
</html>
