<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>03_example</title>

        <script src="jquery-1.7.2.min.js"></script>
        <script src="jquery-ui-1.8.23.custom.min.js"></script> 
        <!-- 제이쿼리 링크 순서 1.라이브러리 2. UI -->

        <script>

            /* 

            ** 효과메서드 : 소요시간 / 가속도(easing) / 콜백함수()

            1. show() - display 상태를 none이 아닌 것으로 변경(원래 값으로!) 

            2. hide() - display 상태를 none 으로 변경

            3. animate({
                css 설정
            }, 소요시간(ms), 가속도, 콜백함수) 
            -css 변경사항을 애니메이션 해주는 효과 메서드
            - css에 트랜지션을 넣은 것과 같은 효과 구현
            - 수치로 된 속성값만 적용 가능


            4. delay()
            : 효과 메서드 앞에서 사용
            : 효과 메서드 시작을 지연시킬 때 사용



            */

            //예제 - 색상 버튼을 클릭하면 색상 정보가 변경되고, img-box 의 배경색이 클릭한 버튼의 색상으로 변경되도록 구현하시오.
            
            /* 
            색상 버튼을 클릭하면 >> 클릭대상 : 버튼, 이벤트: 클릭

            1) 색상정보를 바꾸고 > .select span / text()
            2) .img-box 의 배경색 변경! >> .img-box / css()

            우리에게 필요한 값은?
            >> 내가 클릭한 버튼의 색상!! -> 내가 클릭한 버튼의 버튼명!
            >> 버튼명 반환 -> text()
            
            */

            $(document).ready(function(){
                $('button').click(function(){
                    //클릭한 버튼의 버튼명 반환
                    var color = $(this).text();
                    console.log(color);

                    /* //1) 색상정보변경
                    $('.select').find('span').text(color).css('color',color);

                    //2) .img-box 배경색 변경
                    $('.img-box').css('background-color',color) */
                
                    // $('.select').hide(1000).text(color);

                    $('.select').hide(1000, function(){ //콜백함수
                        // alert('안녕!!');
                        $(this).find('span').text(color).css('color',color); //하이드 된 셀렉트 this

                    }).show(1000);

                    //2) img-box 변경
                    $('.img-box').delay(2000).animate({ //delay 뒤에 효과 메세지가 있어야 구현 가능
                        backgroundColor: color //라이브러리 추가연결(문자로 연결된 값중에 컬러 부분만 가능)
                    }, 800 , function(){
                        // + 이미지 등장!
                        $(this).find('img').css({
                            transform: 'scale(1)',
                            transition: 'all 1s'
                        });
                    });



                    
                
                });
            });
        </script>
    </head>
    <body>

        <div id="container">
            <h1>무지개색 버튼을 클릭해 보세요!</h1>
            <p class="select"><span>색상</span>을(를) 선택하셨습니다!</p>

            <div class="btngrp">
                <button>red</button>
                <button>orange</button>
                <button>yellow</button>
                <button>green</button>
                <button>blue</button>
                <button>navy</button>
                <button>purple</button>
            </div>

            <div class="img-box">
                <img src="https://i.namu.wiki/i/abZPxKt_L98I8ttqw56pLHtGiR5pAV4YYmpR3Ny3_n0yvff5IDoKEQFof7EbzJUSZ_-uzR5S7tzTzGQ346Qixw.webp" alt="아기고양이">
            </div>

        </div>

        <style>
            p {
                font-size: 24px;
            }

            span {
                font-weight: bold;
            }

            button {
                font-size: 24px;
            }

            .btngrp {
                margin-bottom: 20px;
            }

            .img-box {
                width: 800px; 
                background-color: #000;
                padding: 20px;
                /* width 값이 없을 때는 box-sizing 할 필요없음 
                width 값이 없을 때는 부모값을 기준으로 패딩값과 보더값을 포함한 너비를 갖는다!
                */
            }
            .img-box img {
                width: 100%;
                display: block;
                transform: scale(0);
            }
        </style>
        
    </body>
</html>
