<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>05_mouseover()_mouseout()</title>

        <script src="jquery-1.12.4.min.js"></script>

        <script>

            /* 
            mouseover()

            mouseout()
            
            */

            $(document).ready(function(){

                //on() 여러개 이벤트등록하기
                $('.btn1').on({
                    'mouseover': function(){
                        $('.txt1').css({
                            backgroundColor : 'yellow'
                        });
                    },
                    'mouseout' : function(){
                        $('.txt1').css({
                            backgroundColor : 'transparent'
                        });
                    },
                });
            });

        </script>
    </head>
    <body>

        <button class="btn1">mouse over / out</button>
        <p class="txt1">내용</p>
        
    </body>
</html>
